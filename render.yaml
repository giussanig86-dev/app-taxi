services:
  # ============ BACKEND ============
  - type: web
    name: app-taxi-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && node src/seed/init-database.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: app-taxi-frontend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL

  # ============ FRONTEND ============
  - type: web
    name: app-taxi-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: app-taxi-backend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
